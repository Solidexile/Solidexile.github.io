# Free Supabase projects pause after about a week with no database activity,
# which breaks DropKeeper's Instagram login and feedback form. This pings the
# project once a day so that never happens. The ping only reads one row.
name: Keep DropKeeper server awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: curl --fail --silent --show-error --max-time 30 https://qkssetkpwxnmmagvphup.supabase.co/functions/v1/ping
