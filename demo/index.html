  :root{

  *{margin:0;padding:0;box-sizing:border-box}

  .brand{font-weight:900;font-size:22px;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
  .brand .t{color:var(--blue)}
  .brand small{font-weight:600;font-size:12px;color:var(--ink3);margin-inline-start:6px;letter-spacing:0}
  .langs{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:3px}
  .langs button{border:0;background:none;color:var(--ink2);font:inherit;font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer}
  .langs button.on{background:var(--blue);color:#06101f}

  .hero{padding:56px 0 40px;background:radial-gradient(900px 520px at 50% 0%, rgba(77,163,255,.18), transparent 70%)}
  .hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
  .kick{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:rgba(77,163,255,.12);border:1px solid rgba(77,163,255,.3);padding:5px 12px;border-radius:999px;margin-bottom:18px}
  h1{font-size:clamp(34px,5.2vw,58px);line-height:1.06;letter-spacing:-.03em;font-weight:900}
  h1 .am{color:var(--amber)}
  .lead{margin-top:18px;font-size:clamp(17px,1.9vw,20px);color:var(--ink2);max-width:560px}
  .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:12px;padding:15px 22px;font:inherit;font-weight:800;font-size:17px;text-decoration:none;cursor:pointer;transition:transform .15s, filter .15s}

  .btn.primary{background:var(--blue);color:#06101f;box-shadow:0 10px 30px rgba(77,163,255,.3)}
  .btn.wa{background:var(--wa);color:#04210f}
  .btn.wa-ghost{background:transparent;color:var(--wa);border:2px solid rgba(37,211,102,.55);padding:13px 20px}
  .btn svg{width:20px;height:20px;flex:none}
  .trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;color:var(--ink2);font-size:15px}
  .trust span::before{content:"✓";color:var(--good);font-weight:900;margin-inline-end:7px}

  .video .play{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:14px;border:0;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 45%);cursor:pointer}

  .video .play i{width:58px;height:58px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 10px 40px rgba(77,163,255,.5)}
  .video .play i::after{content:"";border-left:19px solid #06101f;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}

  .feat p{color:var(--ink2);font-size:15.5px}

  .pill::before{content:"✓";color:var(--good);font-weight:900;margin-inline-end:8px}

  .book .card{max-width:640px;margin:32px auto 0;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}

  .f{display:flex;flex-direction:column;gap:6px}
  .f.full{grid-column:1/-1}
  label{font-size:14px;font-weight:700;color:var(--ink2)}
  label .opt{font-weight:500;color:var(--ink3)}
  input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--ground2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
  textarea{min-height:84px;resize:vertical}
  .f.full .btn{width:100%;margin-top:4px}
  .note{font-size:13px;color:var(--ink3);text-align:center;grid-column:1/-1}
  .err{color:var(--bad);font-size:14px;text-align:center;grid-column:1/-1;display:none}
  .or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:14px;margin:22px 0 14px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .card .btn.wa{width:100%}
  .thanks{display:none;text-align:center}
  .thanks .big{font-size:52px}
  .thanks h3{font-size:26px;font-weight:900;margin:6px 0 8px}
  .thanks p{color:var(--ink2);margin-bottom:20px}
  .done form,.done .or,.done .wa-alt{display:none}
  .done .thanks{display:block}

  footer{padding:30px 0 90px;color:var(--ink3);font-size:14px;text-align:center}
  footer a{color:var(--ink2)}

  [dir=rtl] h1,[dir=rtl] h2{letter-spacing:0}

  @media (max-width:880px){

  @media (max-width:560px){
    .feats{grid-template-columns:1fr}

let L = 'en';
function setLang(l){
  L = T[l] ? l : 'en'; const t = T[L];
  document.documentElement.lang = L; document.documentElement.dir = t.dir; document.title = t.title;
  document.querySelectorAll('[data-t]').forEach(e => { const v = t[e.dataset.t]; if (v != null) e.innerHTML = v; });
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === L));
  const wa = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t.waText);
  document.querySelectorAll('[data-wa]').forEach(a => { a.href = wa; a.target = '_blank'; a.rel = 'noopener'; });
  try { localStorage.setItem('tk-lang', L); } catch (e) {}
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
(function(){
  let l = new URLSearchParams(location.search).get('lang');
  if (!l) { try { l = localStorage.getItem('tk-lang'); } catch (e) {} }
  if (!l) { const n = (navigator.language || '').slice(0, 2); l = n === 'ar' ? 'ar' : n === 'fr' ? 'fr' : 'en'; }
  setLang(l);
})();

function conversion(kind){
  if (CONV[kind]) gtag('event', 'conversion', { send_to: ADS + '/' + CONV[kind], value: 1.0, currency: 'USD' });
  gtag('event', kind === 'lead' ? 'generate_lead' : 'whatsapp_click', { lang: L });
}
// count WhatsApp taps once per page view
let waCounted = false;
document.addEventListener('click', e => { if (e.target.closest('[data-wa]') && !waCounted) { waCounted = true; conversion('whatsapp'); } });

const video = document.getElementById('trailer'), playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', () => { video.controls = true; playBtn.remove(); video.play(); gtag('event', 'video_play'); });

const form = document.getElementById('form'), err = document.getElementById('err'), send = document.getElementById('send');
form.addEventListener('submit', async e => {
  e.preventDefault(); err.style.display = 'none';
  const d = Object.fromEntries(new FormData(form));
  if (!d.name.trim() || !d.business.trim() || !d.phone.trim() || !d.type) { err.textContent = T[L].errReq; err.style.display = 'block'; return; }
  send.disabled = true; send.textContent = T[L].sending;
  try {
    const r = await fetch(FORM_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ ...d, language: L, _subject: 'TradeKeeper demo request: ' + d.business, _template: 'table' }) });
    if (!r.ok) throw new Error(r.status);
    conversion('lead');
    document.getElementById('card').classList.add('done');
    document.getElementById('card').scrollIntoView({ block: 'center' });
  } catch (x) {
    err.textContent = T[L].errSend; err.style.display = 'block';
    send.disabled = false; send.textContent = T[L].send;
  }
});
</script>
