<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0d0e; color: #ece6e7;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  a { color: #FF4655; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #FF4655; margin: 0 auto 14px; animation: p 1s infinite alternate; }
  @keyframes p { to { opacity: .25; } }
</style>
</head>
<body>
<main>
  <div class="dot"></div>
  <p id="msg">Opening…</p>
</main>
<script>
  // A DropKeeper tracked link: count the visit, then forward to where the
  // seller pointed it (usually their WhatsApp chat or a listing).
  (function () {
    var server = 'https://qkssetkpwxnmmagvphup.supabase.co/functions/v1/go';
    var code = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
    var msg = document.getElementById('msg');
    if (!/^[a-z0-9]{6,12}$/.test(code)) { msg.textContent = 'This link is not valid.'; return; }
    fetch(server + '?json=1&c=' + code)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.target && /^https:\/\//.test(d.target)) location.replace(d.target);
        else msg.innerHTML = 'This link has expired. <a href="https://solidexile.github.io/">Solidify</a>';
      })
      .catch(function () { location.replace(server + '?c=' + code); });
  })();
</script>
</body>
</html>
